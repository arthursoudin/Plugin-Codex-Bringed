config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  tunnel_id: "tunnel_REPLACE_WITH_YOUR_ID"
  api_key: "env:CONTROL_PLANE_API_KEY"
health:
  listen_addr: "127.0.0.1:18080"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  extra_headers:
    X-CodexBridge-Token: "env:CODEXBRIDGE_MCP_TOKEN"
  server_urls:
    - channel: main
      url: "http://127.0.0.1:18473/mcp"
